<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Account - Account Management</title>
    <link rel="stylesheet" href="/static/style/chat.css">
    <style>
        .account-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .account-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .user-welcome {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f8f9fa;
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: white;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: #007bff;
            outline: none;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-block {
            width: 100%;
            display: block;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .nav-link {
            color: #007bff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav-link:hover {
            background: #f8f9fa;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #007bff;
        }

        .stat-label {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="account-container">
        <div class="account-card">
            <!-- Willkommensbereich -->
            <div class="user-welcome">
                <div class="user-avatar">👤</div>
                <h2>Mein Account</h2>
                <p>Willkommen, <strong id="usernameDisplay">Benutzer</strong>!</p>
            </div>

            <!-- Account-Statistiken -->
            <div class="section">
                <h3 class="section-title">Meine Aktivität</h3>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number" id="messageCount">0</div>
                        <div class="stat-label">Nachrichten</div>
                    </div>
                </div>
            </div>

            <!-- Passwort ändern -->
            <div class="section">
                <h3 class="section-title">Passwort ändern</h3>
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label for="currentPassword">Aktuelles Passwort</label>
                        <input type="password" id="currentPassword" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Neues Passwort</label>
                        <input type="password" id="newPassword" class="form-control" required minlength="3">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Neues Passwort bestätigen</label>
                        <input type="password" id="confirmPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Passwort ändern</button>
                </form>
                <div id="passwordMessage" class="message hidden"></div>
            </div>

            <!-- Account löschen -->
            <div class="section">
                <h3 class="section-title" style="color: #e74c3c;">Account löschen</h3>
                <p style="color: #6c757d; margin-bottom: 20px;">
                    Achtung: Diese Aktion kann nicht rückgängig gemacht werden. Ihr Account und alle Daten werden permanent gelöscht.
                </p>
                <button onclick="showDeleteConfirmation()" class="btn btn-danger btn-block">Account löschen</button>

                <!-- Bestätigungsdialog -->
                <div id="deleteConfirmation" class="hidden" style="margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 8px;">
                    <div class="form-group">
                        <label for="deletePassword">Bitte geben Sie Ihr Passwort zur Bestätigung ein:</label>
                        <input type="password" id="deletePassword" class="form-control" placeholder="Ihr aktuelles Passwort">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="deleteAccount()" class="btn btn-danger">Endgültig löschen</button>
                        <button onclick="hideDeleteConfirmation()" class="btn" style="background: #6c757d; color: white;">Abbrechen</button>
                    </div>
                </div>
            </div>

            <!-- Navigationslinks -->
            <div class="nav-links">
                <a href="/chat" class="nav-link">💬 Zum Chat</a>
                <a href="/view" class="nav-link">👀 Chat ansehen</a>
                <a href="/logout" class="nav-link" style="color: #e74c3c;">🚪 Abmelden</a>
            </div>
        </div>
    </div>

    <script>
        let currentUsername = '';

        // Beim Laden der Seite Benutzerdaten abrufen
        document.addEventListener('DOMContentLoaded', function() {
            loadUserData();
        });

        function loadUserData() {
            fetch('/api/account/userdata')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Nicht autorisiert');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.username) {
                        currentUsername = data.username;
                        document.getElementById('usernameDisplay').textContent = data.username;
                        document.getElementById('messageCount').textContent = data.message_count || 0;
                    } else {
                        // Nicht eingeloggt, zum Login weiterleiten
                        window.location.href = '/login?error=Bitte einloggen';
                    }
                })
                .catch(error => {
                    console.error('Fehler:', error);
                    window.location.href = '/login?error=Bitte einloggen';
                });
        }

        // Passwort-Änderungsformular
        document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('passwordMessage');

            // Validierung
            if (newPassword !== confirmPassword) {
                showMessage(messageDiv, 'Die neuen Passwörter stimmen nicht überein!', 'error');
                return;
            }

            if (newPassword.length < 3) {
                showMessage(messageDiv, 'Das neue Passwort muss mindestens 3 Zeichen lang sein!', 'error');
                return;
            }

            // Passwort ändern
            fetch('/api/account/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `current_password=${encodeURIComponent(currentPassword)}&new_password=${encodeURIComponent(newPassword)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage(messageDiv, 'Passwort erfolgreich geändert!', 'success');
                    document.getElementById('changePasswordForm').reset();
                } else {
                    showMessage(messageDiv, 'Fehler: ' + (data.error || 'Passwortänderung fehlgeschlagen'), 'error');
                }
            })
            .catch(error => {
                showMessage(messageDiv, 'Fehler beim Ändern des Passworts', 'error');
                console.error('Error:', error);
            });
        });

        function showDeleteConfirmation() {
            document.getElementById('deleteConfirmation').classList.remove('hidden');
        }

        function hideDeleteConfirmation() {
            document.getElementById('deleteConfirmation').classList.add('hidden');
            document.getElementById('deletePassword').value = '';
        }

        function deleteAccount() {
            const password = document.getElementById('deletePassword').value;

            if (!password) {
                alert('Bitte geben Sie Ihr Passwort zur Bestätigung ein.');
                return;
            }

            if (!confirm('Sind Sie sicher, dass Sie Ihren Account unwiderruflich löschen möchten?')) {
                return;
            }

            fetch('/api/account/delete-account', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `password=${encodeURIComponent(password)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Ihr Account wurde erfolgreich gelöscht.');
                    window.location.href = '/login?message=Account gelöscht';
                } else {
                    alert('Fehler: ' + (data.error || 'Account-Löschung fehlgeschlagen'));
                }
            })
            .catch(error => {
                alert('Fehler beim Löschen des Accounts');
                console.error('Error:', error);
            });
        }

        function showMessage(element, text, type) {
            element.textContent = text;
            element.className = `message ${type}`;
            element.classList.remove('hidden');

            // Nachricht nach 5 Sekenden ausblenden
            setTimeout(() => {
                element.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
