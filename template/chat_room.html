<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <link rel="stylesheet" href="/static/style/chat.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Chat Room</h2>
            <div class="user-info">
                <span>Eingeloggt als: <strong>{{username}}</strong></span>
                <div class="header-buttons">
                    <a href="/account" class="account-btn">👤 Account</a>
                    <a href="/logout" class="logout-btn">Logout</a>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="messageContainer">
            <!-- Nachrichten werden via JavaScript geladen -->
            <div class="loading-message">Lade Nachrichten...</div>
        </div>

        <div class="chat-input">
            <form id="messageForm">
                <input type="text" id="messageInput" placeholder="Schreibe eine Nachricht..." autocomplete="off" maxlength="500">
                <button type="submit">Senden</button>
            </form>
        </div>
    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
