<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren - SimpleChat</title>
    <link rel="stylesheet" href="/static/style/chat.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #6c757d;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: #007bff;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #545b62;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .login-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .login-link {
            color: #007bff;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .password-requirements {
            font-size: 0.8em;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Account erstellen</h2>
                <p>Registrieren Sie sich für den SimpleChat</p>
            </div>

            <div id="registerMessage" class="message hidden"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" class="form-control" required minlength="3" maxlength="20" placeholder="Wählen Sie einen Benutzernamen">
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" class="form-control" required minlength="3" maxlength="100" placeholder="Wählen Sie ein Passwort">
                    <div class="password-requirements">Mindestens 3 Zeichen</div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Passwort bestätigen</label>
                    <input type="password" id="confirmPassword" class="form-control" required placeholder="Wiederholen Sie das Passwort">
                </div>

                <button type="submit" class="btn btn-primary">Account erstellen</button>
            </form>

            <div class="login-links">
                <p>Bereits einen Account? <a href="/login" class="login-link">Hier anmelden</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('registerMessage');

            // Validierung
            if (username.length < 3) {
                showMessage(messageDiv, 'Benutzername muss mindestens 3 Zeichen lang sein!', 'error');
                return;
            }

            if (password.length < 3) {
                showMessage(messageDiv, 'Passwort muss mindestens 3 Zeichen lang sein!', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage(messageDiv, 'Passwörter stimmen nicht überein!', 'error');
                return;
            }

            // Registrierung
            fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(text) });
                }
                return response.text();
            })
            .then(data => {
                if (data.includes('success')) {
                    showMessage(messageDiv, 'Account erfolgreich erstellt! Sie werden zum Login weitergeleitet...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login?message=Account erfolgreich erstellt';
                    }, 2000);
                } else {
                    showMessage(messageDiv, 'Fehler bei der Registrierung', 'error');
                }
            })
            .catch(error => {
                const errorText = error.message.toLowerCase();
                if (errorText.includes('benutzername existiert bereits')) {
                    showMessage(messageDiv, 'Benutzername existiert bereits!', 'error');
                } else {
                    showMessage(messageDiv, 'Fehler bei der Registrierung: ' + error.message, 'error');
                }
            });
        });

        function showMessage(element, text, type) {
            element.textContent = text;
            element.className = `message ${type}`;
            element.classList.remove('hidden');

            // Automatisch ausblenden nach 5 Sekunden (außer bei Erfolg)
            if (type !== 'success') {
                setTimeout(() => {
                    element.classList.add('hidden');
                }, 5000);
            }
        }

        // Live-Validierung
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const messageDiv = document.getElementById('registerMessage');

            if (confirmPassword && password !== confirmPassword) {
                showMessage(messageDiv, 'Passwörter stimmen nicht überein!', 'error');
            } else if (confirmPassword && password === confirmPassword) {
                messageDiv.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
